name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Release notes = commit headers since the previous tag
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          # electron-builder picks build/release-notes.md up and writes it into latest-mac.yml.
          git log -30 --no-merges --format='- %s' ${prev:+"$prev..${GITHUB_REF_NAME}"} \
            | grep -Ev '^- v?[0-9]+\.[0-9]+\.[0-9]+$' > build/release-notes.md || true
          cat build/release-notes.md

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="${RUNNER_TEMP}/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="${KEY_DIR}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printenv APPLE_API_KEY > "$KEY_PATH"
          echo "APPLE_API_KEY=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: Build Mac DMG + updater zip (signed + notarized)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build && npx electron-builder --mac --publish never

      - name: OTA survival smoke (launch + updater + feed artifacts)
        run: |
          set -euo pipefail
          APP=$(find release -type d -name 'Plenum.app' | head -1)
          test -n "$APP"
          node .agents/skills/plenum-release/scripts/pack-imports-check.mjs --app "$APP"
          node .agents/skills/plenum-release/scripts/pack-launch-smoke.mjs --app "$APP" --ms 10000
          node .agents/skills/plenum-release/scripts/ota-health-check.mjs \
            --app "$APP" \
            --artifacts release \
            --live-feed

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      # Full suite runs on release-mac. Windows still has Unix-fixture gaps (launcher
      # symlinks, detached Git Bash smoke); pack + OTA smoke below are the Windows gate.
      - name: Smoke unit tests (Windows-critical)
        run: >
          node --test --test-concurrency=1
          electron/lane/shell.test.mjs
          electron/os-open.test.mjs
          electron/github-star.test.mjs
          .agents/skills/plenum-release/scripts/pack-imports-check.test.mjs

      - name: Release notes = commit headers since the previous tag
        shell: bash
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          git log -30 --no-merges --format='- %s' ${prev:+"$prev..${GITHUB_REF_NAME}"} \
            | grep -Ev '^- v?[0-9]+\.[0-9]+\.[0-9]+$' > build/release-notes.md || true
          cat build/release-notes.md

      - name: Ensure Windows icon exists
        shell: bash
        run: |
          if [[ ! -f build/icon.ico ]]; then
            node scripts/build-icons.mjs
          fi
          test -f build/icon.ico

      - name: Build Windows NSIS installer (unsigned)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # Unsigned on purpose — no cert. Users see SmartScreen until a signer is added later.
        run: npm run build && npx electron-builder --win --publish never

      - name: OTA survival smoke (launch + updater + feed artifacts)
        shell: bash
        run: |
          set -euo pipefail
          # Prefer win-unpacked (not a random find hit under release/).
          APP=release/win-unpacked/Plenum.exe
          test -f "$APP"
          node .agents/skills/plenum-release/scripts/pack-imports-check.mjs --app "$APP"
          node .agents/skills/plenum-release/scripts/pack-launch-smoke.mjs --app "$APP" --ms 10000
          node .agents/skills/plenum-release/scripts/ota-health-check.mjs \
            --app "$APP" \
            --artifacts release \
            --platform win \
            --live-feed

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: [release-mac, release-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release-mac

      - uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release-win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-mac/*.dmg
            release-mac/*.zip
            release-mac/*.blockmap
            release-mac/latest-mac.yml
            release-win/*.exe
            release-win/*.blockmap
            release-win/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Stage public update feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-ftp
          cp release-mac/latest-mac.yml release-ftp/
          cp release-mac/*.zip release-ftp/
          cp release-mac/*.blockmap release-ftp/ 2>/dev/null || true
          dmg=$(ls release-mac/*.dmg | head -1)
          cp "$dmg" release-ftp/Plenum.dmg
          cp "$dmg" "release-ftp/$(basename "$dmg")"

          cp release-win/latest.yml release-ftp/
          cp release-win/*.blockmap release-ftp/ 2>/dev/null || true
          # Versioned NSIS plus stable first-install name for the landing Download link.
          for f in release-win/*.exe; do
            cp "$f" "release-ftp/$(basename "$f")"
          done
          setup=$(ls release-win/Plenum-Setup-*.exe | head -1)
          cp "$setup" release-ftp/Plenum-Setup.exe
          ls -la release-ftp

      - name: FTP upload to plenum.sh/updates
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./release-ftp/
          # e.g. public_html/updates/ — must be the dir served at https://plenum.sh/updates/
          server-dir: ${{ secrets.FTP_UPDATES_DIR }}
          dangerous-clean-slate: false
