<!doctype html>
<!-- avoid-ai-design-ignore-file: SD7, K7 (focus-visible rules live in mock.css) -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plenum new lane</title>
    <link rel="icon" href="../assets/app-icon-16.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="mock.css" />
    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="graph.js"></script>
    <script src="board.js"></script>
  </head>
  <body class="desk">
    <div class="window">
      <!-- avoid-ai-design-ignore: SD7, Mac app title bar -->
      <header class="titlebar">
        <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="appmark" aria-label="Plenum">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5.5 3.5 V12.5 M5.5 11 C5.5 8.5 9.5 9.5 9.5 7 V6" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <circle cx="9.5" cy="5" r="1.6" fill="#5e6ad2" />
          </svg>
        </div>
        <nav class="tabstrip" aria-label="Open repositories">
          <button class="tab active" type="button" aria-current="page">
            <svg class="icon sm" aria-hidden="true"><use href="#i-folder-simple"></use></svg>
            Mobaro Web
            <span class="close" aria-label="Close tab"><svg class="icon sm" aria-hidden="true"><use href="#i-x"></use></svg></span>
          </button>
          <button class="tab" type="button">
            <svg class="icon sm" aria-hidden="true"><use href="#i-folder-simple"></use></svg>
            mobaro-core
          </button>
          <button class="tab add" type="button" aria-label="Add repository">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
          </button>
        </nav>
        <div class="title-actions">
          <span class="live"><i aria-hidden="true"></i><span data-live-since>synced 2m ago</span><span data-live-count></span></span>
          <button class="searchbtn" type="button" data-palette-open>
            <svg class="icon sm" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg>
            <span>Lanes, branches, files, commands</span>
            <kbd>⌘K</kbd>
          </button>
        </div>
      </header>

      <!-- Board underneath, so the sheet reads as a sheet over the real window -->
      <div class="body" aria-hidden="true">
        <aside class="panel"></aside>
        <main class="main">
          <header class="lane-head"></header>
          <section class="graph">
            <div class="graph-cols"><span>Graph</span><span>Commit</span><span>Author</span><span>SHA</span><span>When</span></div>
            <div class="rows"></div>
          </section>
        </main>
      </div>

      <div class="modal-layer">
        <form class="modal" role="dialog" aria-labelledby="new-lane-title" onsubmit="return false">
          <div class="eyebrow">
            <svg class="icon sm" aria-hidden="true"><use href="#i-tree-structure"></use></svg>
            New lane
          </div>
          <h1 id="new-lane-title">From latest main</h1>
          <p>A linked worktree on its own branch. Primary <span class="mono">main</span> is not touched.</p>
          <label class="field">
            Feature name
            <input value="invoice-pdf" />
          </label>
          <label class="field">
            Branch
            <input value="feat/invoice-pdf" />
          </label>
          <label class="field">
            Base
            <select>
              <option>origin/main, synced 2m ago</option>
              <option>origin/develop</option>
            </select>
          </label>
          <div class="check">
            <svg class="icon" aria-hidden="true"><use href="#i-shield-check"></use></svg>
            <div>
              <strong>Team step.</strong>
              Base is current <span class="mono">origin/main</span>. If main moves later, this lane shows as behind on the board.
            </div>
          </div>
          <div class="row-end">
            <button class="btn" type="button">Cancel</button>
            <button class="btn primary" type="submit">
              <svg class="icon sm" aria-hidden="true"><use href="#i-arrow-square-out"></use></svg>
              Create and open in Cursor
            </button>
          </div>
        </form>
      </div>
    </div>
    <p class="caption">New lane. The only write Plenum does besides guarded remove.</p>
  </body>
</html>
