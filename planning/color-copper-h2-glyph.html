<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plenum — H2 with gradient glyph</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--foreground);
    padding: 8px 0 24px;
  }
  h1 { margin: 0 0 4px; font-size: 16px; letter-spacing: -0.02em; }
  .lede { margin: 0 0 14px; color: var(--muted-foreground); max-width: 46rem; }
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  figure {
    margin: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    overflow: hidden;
  }
  .head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
  }
  .head strong { font-size: 13px; }
  .head .id { font: 500 11px var(--font-mono); color: var(--muted-foreground); }
  .body { padding: 12px; display: grid; gap: 10px; }
  .blurb { margin: 0; font-size: 12px; color: var(--muted-foreground); min-height: 2.8em; }
  .stages { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stage {
    border-radius: 10px; min-height: 120px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .desk { background: #c4a882; }
  .wall { background: #2a2b30; }
  .tile { width: 72px; height: 72px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 22px rgba(0,0,0,.32); }
  .tile svg { display: block; width: 72px; height: 72px; }
  .mini { display: flex; flex-direction: column; gap: 8px; }
  .f32 { width: 32px; height: 32px; border-radius: 7px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.28); }
  .f16 { width: 16px; height: 16px; border-radius: 3.5px; overflow: hidden; box-shadow: 0 4px 12px rgba(0,0,0,.28); }
  .f32 svg, .f16 svg { display: block; width: 100%; height: 100%; }
  .cap {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    font-size: 10px; color: var(--muted-foreground); text-align: center; margin-top: -2px;
  }
  .alone {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    padding: 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--secondary);
  }
  .alone .g72 { width: 72px; height: 72px; }
  .alone .g72 svg { width: 72px; height: 72px; display: block; }
  .alone .lbl { font-size: 11px; color: var(--muted-foreground); }
  .pick {
    margin-top: 12px; padding: 12px 14px;
    border: 1px solid color-mix(in srgb, #b86b3a 45%, var(--border));
    border-radius: var(--radius);
    background: color-mix(in srgb, #b86b3a 10%, var(--card));
    font-size: 12px; color: var(--muted-foreground);
  }
  .pick em { font-style: normal; font-weight: 600; color: var(--foreground); }
</style>
</head>
<body>
  <h1>H2 + gradient glyph</h1>
  <p class="lede">
    Tile keeps vertical forge. Glyph gets the same forge family instead of flat white.
    Same stops on both = mud; glyph needs a lighter pass of the same gradient.
  </p>
  <div class="board" id="board"></div>
  <p class="pick"><em>Locking G2</em> — tile H2 deep forge, glyph lighter forge (same vertical). Also works as a standalone glyph.</p>

<script>
const PATHS = [
  `M12.50,6.00 L11.24,6.29 L9.98,6.97 L8.91,8.13 L8.23,10.27 L8.23,12.01 L8.91,14.05 L9.88,15.22 L11.63,16.09 L12.99,16.28 L30.74,16.19 L32.58,16.57 L33.55,17.16 L53.54,17.16 L51.50,16.38 L41.22,16.38 L38.99,15.60 L37.63,14.44 L36.75,12.99 L36.17,9.78 L35.40,8.13 L34.33,7.07 L32.49,6.19 L31.42,6.00 Z`,
  `M10.07,15.31 L11.04,15.90 L12.99,16.28 L30.74,16.19 L32.00,16.38 L33.75,17.25 L34.72,18.22 L35.49,19.68 L35.78,21.04 L35.69,22.88 L35.20,24.24 L34.13,25.60 L32.68,26.47 L31.81,26.66 L12.99,26.66 L11.63,26.96 L10.17,27.83 L37.72,27.83 L38.99,26.96 L40.73,26.47 L51.60,26.47 L53.05,26.08 L54.22,25.31 L55.28,23.85 L55.67,22.69 L55.77,20.84 L55.09,18.71 L53.44,17.06 L51.50,16.38 L41.22,16.38 L39.76,15.99 L38.60,15.31 Z`,
  `M33.55,25.99 L31.81,26.66 L12.99,26.66 L11.92,26.86 L9.98,27.93 L9.01,29.09 L8.23,31.32 L8.43,33.75 L9.01,35.01 L9.88,35.98 L11.14,36.75 L12.79,37.14 L31.22,37.14 L32.39,37.43 L33.65,38.21 L53.63,38.21 L52.57,37.63 L51.40,37.34 L40.73,37.34 L39.47,37.04 L38.31,36.46 L37.14,35.49 L36.27,34.23 L35.78,32.58 L35.88,30.74 L36.56,29.09 L37.63,27.83 L39.47,26.76 L40.73,26.47 L51.60,26.47 L53.15,25.99 Z`,
  `M10.46,36.37 L11.14,36.75 L12.79,37.14 L31.22,37.14 L32.10,37.34 L33.84,38.31 L35.10,39.86 L35.69,41.41 L35.78,43.54 L35.40,45.00 L34.52,46.36 L33.55,47.13 L32.00,47.72 L12.31,47.81 L11.24,48.10 L10.27,48.69 L38.01,48.69 L39.28,47.91 L40.83,47.52 L51.79,47.52 L53.83,46.75 L54.99,45.49 L55.67,43.84 L55.67,41.31 L54.90,39.47 L53.25,37.92 L51.40,37.34 L40.73,37.34 L39.47,37.04 L38.21,36.37 Z`,
  `M33.94,46.84 L32.78,47.52 L31.13,47.81 L11.82,47.91 L9.98,48.88 L8.72,50.53 L8.23,52.47 L8.52,54.80 L9.10,55.96 L10.27,57.13 L11.63,57.81 L12.60,58.00 L31.13,58.00 L32.10,57.81 L33.26,57.32 L34.72,56.06 L35.59,54.41 L36.27,50.82 L37.04,49.56 L38.50,48.30 L40.83,47.52 L51.79,47.52 L53.63,46.84 Z`,
];
const MARK = PATHS.map((d) => `<path d="${d}"/>`).join("");

const HOT = "#d4894f", MID = "#b86b3a", DEEP = "#7d4320";
const GHOT = "#f3d2b0", GMID = "#e0a56a", GDEEP = "#c47a42";

function tileIcon(id, kind, size) {
  const s = (size / 1024) * 12;
  const t = (size / 1024) * 128;
  let defs = "";
  let markFill = "#fff";
  let tileFill = `url(#${id}-tile)`;

  if (kind === "g1") {
    // same stops — muddy
    defs = `
      <linearGradient id="${id}-tile" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="${HOT}"/><stop offset="48%" stop-color="${MID}"/><stop offset="100%" stop-color="${DEEP}"/>
      </linearGradient>
      <linearGradient id="${id}-glyph" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="${HOT}"/><stop offset="48%" stop-color="${MID}"/><stop offset="100%" stop-color="${DEEP}"/>
      </linearGradient>`;
    markFill = `url(#${id}-glyph)`;
  } else if (kind === "g2") {
    // recommended: lighter glyph forge
    defs = `
      <linearGradient id="${id}-tile" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="${HOT}"/><stop offset="48%" stop-color="${MID}"/><stop offset="100%" stop-color="${DEEP}"/>
      </linearGradient>
      <linearGradient id="${id}-glyph" x1="0.5" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0%" stop-color="${GHOT}"/><stop offset="48%" stop-color="${GMID}"/><stop offset="100%" stop-color="${GDEEP}"/>
      </linearGradient>`;
    markFill = `url(#${id}-glyph)`;
  } else if (kind === "g3") {
    // dark tile, full copper glyph
    defs = `
      <linearGradient id="${id}-tile" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="#2a211c"/><stop offset="100%" stop-color="#120e0c"/>
      </linearGradient>
      <linearGradient id="${id}-glyph" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="${HOT}"/><stop offset="48%" stop-color="${MID}"/><stop offset="100%" stop-color="${DEEP}"/>
      </linearGradient>`;
    markFill = `url(#${id}-glyph)`;
  } else if (kind === "g4") {
    // shared userSpaceOnUse forge across whole icon + lighter glyph overlay trick: glyph uses bright forge
    defs = `
      <linearGradient id="${id}-tile" x1="0" y1="0" x2="0" y2="${size}" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="${HOT}"/><stop offset="48%" stop-color="${MID}"/><stop offset="100%" stop-color="${DEEP}"/>
      </linearGradient>
      <linearGradient id="${id}-glyph" x1="0" y1="0" x2="0" y2="${size}" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#f7e2cc"/><stop offset="45%" stop-color="#e8b078"/><stop offset="100%" stop-color="#b86b3a"/>
      </linearGradient>`;
    markFill = `url(#${id}-glyph)`;
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <defs>${defs}</defs>
    <rect width="${size}" height="${size}" rx="${(size * 0.222).toFixed(1)}" fill="${tileFill}"/>
    <g transform="translate(${t} ${t}) scale(${s})" fill="${markFill}">${MARK}</g>
  </svg>`;
}

function aloneGlyph(id, size) {
  const s = (size / 64) * 0.75;
  const t = (size / 64) * 8;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <defs>
      <linearGradient id="${id}-g" x1="0.5" y1="0" x2="0.5" y2="1">
        <stop offset="0%" stop-color="${HOT}"/><stop offset="48%" stop-color="${MID}"/><stop offset="100%" stop-color="${DEEP}"/>
      </linearGradient>
    </defs>
    <g transform="translate(${t} ${t}) scale(${s})" fill="url(#${id}-g)">${MARK}</g>
  </svg>`;
}

const VARIANTS = [
  {
    id: "G1",
    name: "Same stops",
    blurb: "Tile and glyph share exact H2 stops. Attached, but contrast collapses — especially at 16px.",
    kind: "g1",
  },
  {
    id: "G2",
    name: "Lighter forge glyph",
    blurb: "Same vertical forge, glyph lifted a step. Metal on metal that still reads. Recommended lock.",
    kind: "g2",
    lock: true,
  },
  {
    id: "G3",
    name: "Dark tile, copper glyph",
    blurb: "Brand lives in the glyph. Tile stays near-black. Strongest small-size read; less ‘copper square’ in Dock.",
    kind: "g3",
  },
  {
    id: "G4",
    name: "Shared vertical field",
    blurb: "userSpaceOnUse so tile + glyph feel like one forged slab, glyph still a brighter pass.",
    kind: "g4",
  },
];

const board = document.getElementById("board");
for (const v of VARIANTS) {
  const fig = document.createElement("figure");
  if (v.lock) fig.style.outline = "1px solid color-mix(in srgb, #b86b3a 55%, transparent)";
  fig.innerHTML = `
    <div class="head"><strong>${v.name}</strong><span class="id">${v.id}${v.lock ? " · lock" : ""}</span></div>
    <div class="body">
      <p class="blurb">${v.blurb}</p>
      <div class="stages">
        <div class="stage desk">
          <div class="tile">${tileIcon(v.id + "d", v.kind, 72)}</div>
          <div class="mini">
            <div class="f32">${tileIcon(v.id + "d32", v.kind, 32)}</div>
            <div class="f16">${tileIcon(v.id + "d16", v.kind, 16)}</div>
          </div>
        </div>
        <div class="stage wall">
          <div class="tile">${tileIcon(v.id + "w", v.kind, 72)}</div>
          <div class="mini">
            <div class="f32">${tileIcon(v.id + "w32", v.kind, 32)}</div>
            <div class="f16">${tileIcon(v.id + "w16", v.kind, 16)}</div>
          </div>
        </div>
      </div>
      <div class="cap"><span>desk</span><span>dark wall</span></div>
      <div class="alone">
        <div class="g72">${aloneGlyph(v.id + "a", 72)}</div>
        <div class="lbl">standalone glyph<br/>(full H2 forge)</div>
      </div>
    </div>`;
  board.appendChild(fig);
}
</script>
</body>
</html>
