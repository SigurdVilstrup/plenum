<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plenum — lane run icons (B)</title>
  <style>
    :root {
      --canvas: #f5f6f8;
      --surface-1: #eef0f4;
      --surface-2: #e6e9ef;
      --surface-3: #dce1e9;
      --hairline: #d2d7e1;
      --hairline-strong: #bcc3d0;
      --ink: #0c0d12;
      --ink-muted: #353943;
      --ink-subtle: #5c6472;
      --ink-tertiary: #858d9b;
      --primary: #5e6ad2;
      --danger: #d03b3b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 13px/1.4 var(--font);
      color: var(--ink);
      background: transparent;
      padding: 8px 0 12px;
    }
    .caption {
      font-size: 12px;
      color: var(--ink-subtle);
      margin: 0 0 10px;
      max-width: 920px;
    }
    .caption strong { color: var(--ink-muted); font-weight: 600; }
    .window {
      width: 100%;
      max-width: 980px;
      border: 1px solid var(--hairline-strong);
      border-radius: 11px;
      overflow: hidden;
      background: var(--canvas);
      box-shadow: 0 10px 30px rgba(12, 13, 18, 0.08);
    }
    .titlebar {
      display: flex; align-items: center; gap: 10px;
      height: 44px; padding: 0 12px 0 14px;
      background: var(--surface-1); border-bottom: 1px solid var(--hairline);
    }
    .traffic span {
      display: inline-block; width: 11px; height: 11px; border-radius: 50%;
      background: #ff5f57; box-shadow: 12px 0 0 #febc2e, 24px 0 0 #28c840;
    }
    .tab {
      margin-left: 28px; height: 28px; padding: 0 10px;
      display: inline-flex; align-items: center;
      background: var(--canvas); border: 1px solid var(--hairline);
      border-bottom-color: var(--canvas); border-radius: 6px 6px 0 0;
      font-size: 12px; margin-bottom: -1px;
    }
    .toolbar {
      display: grid; grid-template-columns: 1fr auto; align-items: center;
      gap: 12px; min-height: 52px; padding: 8px 12px 8px 14px;
      border-bottom: 1px solid var(--hairline);
    }
    .identity h1 { margin: 0; font-size: 14px; font-weight: 600; }
    .identity .path { font-size: 11px; color: var(--ink-tertiary); }
    .actions { display: flex; gap: 6px; }
    .btn {
      height: 28px; padding: 0 10px; border-radius: 6px;
      border: 1px solid var(--hairline-strong); background: var(--surface-1);
      color: var(--ink-muted); font: 12px/1 var(--font); font-weight: 500;
    }
    .btn[disabled] { opacity: 0.5; }
    .body { display: grid; grid-template-columns: 280px 1fr; min-height: 180px; }
    .panel { border-right: 1px solid var(--hairline); background: var(--surface-1); padding: 10px 0 0; }
    .section {
      font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--ink-tertiary); padding: 0 12px 6px; font-weight: 600;
    }
    .lane { margin: 0 6px 4px; border-radius: 8px; }
    .lane.selected { background: var(--surface-3); }
    .lane-row {
      display: grid; grid-template-columns: 16px 1fr auto; gap: 8px;
      align-items: center; padding: 7px 8px; font-size: 12.5px; color: var(--ink);
    }
    .lane-row .meta { font-size: 11px; color: var(--ink-subtle); }
    .mark i {
      display: block; width: 8px; height: 8px; border-radius: 50%;
      border: 1.5px solid var(--ink-subtle);
    }
    .mark.running i {
      background: #1f8a3b; border-color: transparent;
      box-shadow: 0 0 0 2px color-mix(in srgb, #1f8a3b 30%, transparent);
    }
    .lane-run {
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px 8px 32px; position: relative;
    }
    .iconbtn {
      width: 26px; height: 26px; border-radius: 5px;
      border: 1px solid var(--hairline); background: var(--canvas);
      color: var(--ink-muted); display: inline-flex; align-items: center;
      justify-content: center; padding: 0; cursor: default;
    }
    .iconbtn svg { width: 14px; height: 14px; }
    .iconbtn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .iconbtn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .fact {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 26px; color: var(--primary);
    }
    .fact svg { width: 14px; height: 14px; }
    .services > summary {
      list-style: none; width: auto; min-width: 26px; padding: 0 5px; gap: 1px;
      display: inline-flex; align-items: center; cursor: pointer;
    }
    .services > summary::-webkit-details-marker { display: none; }
    .main { background: var(--canvas); }
    .graph-cols {
      display: grid; grid-template-columns: 100px 1fr 70px 56px; gap: 8px;
      padding: 8px 14px; border-bottom: 1px solid var(--hairline);
      font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--ink-tertiary);
    }
    .label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--ink-tertiary); margin: 14px 0 6px;
    }
  </style>
</head>
<body>
  <p class="caption">
    <strong>Chosen:</strong> primary play → danger red stop in the same slot.
  </p>

  <div class="label">Stopped</div>
  <div class="window">
    <header class="titlebar">
      <div class="traffic"><span></span></div>
      <div class="tab">plenum-dogfood</div>
    </header>
    <div class="toolbar">
      <div class="identity">
        <h1>agent-cleanup</h1>
        <div class="path">lanes/agent-cleanup</div>
      </div>
      <div class="actions">
        <button class="btn" disabled>Commit</button>
        <button class="btn" disabled>Stash</button>
        <button class="btn" disabled>Pop</button>
        <button class="btn">Pull</button>
        <button class="btn" disabled>Push</button>
      </div>
    </div>
    <div class="body">
      <aside class="panel">
        <div class="section">Lanes</div>
        <div class="lane selected">
          <div class="lane-row">
            <span class="mark"><i></i></span>
            <span class="name">agent-cleanup</span>
            <span class="meta">clean</span>
          </div>
          <div class="lane-run">
            <button class="iconbtn primary" type="button" title="Run" aria-label="Run">
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.2v9.6a.6.6 0 0 0 .92.5l7.2-4.8a.6.6 0 0 0 0-1L5.92 2.7A.6.6 0 0 0 5 3.2z"/></svg>
            </button>
            <button class="iconbtn" type="button" title="Test" aria-label="Test">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2h4M6.5 2v4L4 12.5A2 2 0 0 0 5.8 15h4.4A2 2 0 0 0 12 12.5L9.5 6V2"/></svg>
            </button>
            <details class="services">
              <summary class="iconbtn" title="Open a service">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c1.8 1.8 1.8 9.2 0 11M8 2.5c-1.8 1.8-1.8 9.2 0 11"/></svg>
                <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M4 6l4 4 4-4"/></svg>
              </summary>
            </details>
            <span class="fact" title="Shared data: RavenDB :1338 · SQL Edge :1433 · Postgres :5432" aria-label="Shared data">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v4c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8v4c0 1.1 2.2 2 5 2s5-.9 5-2V8"/></svg>
            </span>
          </div>
        </div>
      </aside>
      <div class="main">
        <div class="graph-cols"><span>Graph</span><span>Commit</span><span>SHA</span><span>When</span></div>
      </div>
    </div>
  </div>

  <div class="label">Running</div>
  <div class="window">
    <header class="titlebar">
      <div class="traffic"><span></span></div>
      <div class="tab">plenum-dogfood</div>
    </header>
    <div class="toolbar">
      <div class="identity">
        <h1>dogfood-toolbar</h1>
        <div class="path">lanes/dogfood-toolbar</div>
      </div>
      <div class="actions">
        <button class="btn" disabled>Commit</button>
        <button class="btn" disabled>Stash</button>
        <button class="btn" disabled>Pop</button>
        <button class="btn">Pull</button>
        <button class="btn" disabled>Push</button>
      </div>
    </div>
    <div class="body">
      <aside class="panel">
        <div class="section">Lanes</div>
        <div class="lane selected">
          <div class="lane-row">
            <span class="mark running"><i></i></span>
            <span class="name">dogfood-toolbar</span>
            <span class="meta">3 behind</span>
          </div>
          <div class="lane-run">
            <button class="iconbtn danger" type="button" title="Stop" aria-label="Stop">
              <svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="1"/></svg>
            </button>
            <button class="iconbtn" type="button" title="Test" aria-label="Test">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2h4M6.5 2v4L4 12.5A2 2 0 0 0 5.8 15h4.4A2 2 0 0 0 12 12.5L9.5 6V2"/></svg>
            </button>
            <details class="services">
              <summary class="iconbtn" title="Open a service">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c1.8 1.8 1.8 9.2 0 11M8 2.5c-1.8 1.8-1.8 9.2 0 11"/></svg>
                <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M4 6l4 4 4-4"/></svg>
              </summary>
            </details>
            <span class="fact" title="Shared data: RavenDB :1338 · SQL Edge :1433 · Postgres :5432" aria-label="Shared data">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v4c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8v4c0 1.1 2.2 2 5 2s5-.9 5-2V8"/></svg>
            </span>
          </div>
        </div>
      </aside>
      <div class="main">
        <div class="graph-cols"><span>Graph</span><span>Commit</span><span>SHA</span><span>When</span></div>
      </div>
    </div>
  </div>
</body>
</html>
