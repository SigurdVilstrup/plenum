<!doctype html>
<!-- avoid-ai-design-ignore-file: SD7, K7 (focus-visible rules live in mock.css) -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overlook board</title>
    <link rel="icon" href="../assets/app-icon-16.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="mock.css" />
    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="graph.js"></script>
    <script src="board.js"></script>
  </head>
  <body class="desk">
    <div class="window">
      <!-- avoid-ai-design-ignore: SD7, Mac app title bar -->
      <header class="titlebar">
        <div class="traffic" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="appmark" aria-label="Overlook">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5.5 3.5 V12.5 M5.5 11 C5.5 8.5 9.5 9.5 9.5 7 V6" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
            <circle cx="9.5" cy="5" r="1.6" fill="#5e6ad2" />
          </svg>
        </div>

        <nav class="tabstrip" aria-label="Open repositories">
          <button class="tab active" type="button" aria-current="page">
            <svg class="icon sm" aria-hidden="true"><use href="#i-folder-simple"></use></svg>
            Mobaro Web
            <span class="close" aria-label="Close tab"><svg class="icon sm" aria-hidden="true"><use href="#i-x"></use></svg></span>
          </button>
          <button class="tab" type="button">
            <svg class="icon sm" aria-hidden="true"><use href="#i-folder-simple"></use></svg>
            mobaro-core
            <span class="close" aria-label="Close tab"><svg class="icon sm" aria-hidden="true"><use href="#i-x"></use></svg></span>
          </button>
          <div class="tab renaming" aria-label="Renaming repository tab">
            <svg class="icon sm" aria-hidden="true"><use href="#i-pencil-simple"></use></svg>
            <input value="Billing API" aria-label="Repository display name" />
          </div>
          <button class="tab add" type="button" aria-label="Add repository">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
          </button>
        </nav>

        <div class="title-actions">
          <span class="live"><i aria-hidden="true"></i><span data-live-since>synced 2m ago</span><span data-live-count></span></span>
          <button class="searchbtn" type="button" data-palette-open>
            <svg class="icon sm" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg>
            <span>Lanes, branches, files, commands</span>
            <kbd>⌘K</kbd>
          </button>
        </div>
      </header>

      <div class="body">
        <aside class="panel" aria-label="Lanes"></aside>

        <main class="main">
          <header class="lane-head"></header>

          <section class="graph" aria-label="Commit graph, read-only">
            <div class="graph-cols" aria-hidden="true">
              <span>Graph</span>
              <span>Commit</span>
              <span>Author</span>
              <span>SHA</span>
              <span>When</span>
            </div>
            <div class="rows" role="table" aria-label="Commits, newest first"></div>
            <footer class="graph-foot">
              <span><i style="background: var(--human)"></i>Human tip</span>
              <span><i style="background: var(--assisted)"></i>Assisted tip</span>
              <span><i style="background: var(--agent)"></i>Agent tip</span>
              <span><svg class="icon sm" aria-hidden="true"><use href="#i-circle-dashed"></use></svg>Uncommitted work sits above its lane's tip</span>
              <span style="margin-left: auto">Read-only. Open the lane to change anything.</span>
            </footer>
          </section>
        </main>
      </div>

      <div class="palette-layer" role="dialog" aria-label="Command palette">
        <div class="palette">
          <div class="search">
            <svg class="icon" aria-hidden="true"><use href="#i-magnifying-glass"></use></svg>
            <input type="text" placeholder="Jump to a lane, branch, file, repo, or command" aria-label="Search" />
            <kbd>esc</kbd>
          </div>
          <div class="results"></div>
          <div class="foot">
            <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
            <span><kbd>↵</kbd> open</span>
            <span><kbd>⌘K</kbd> or <kbd>⌘P</kbd> toggles</span>
          </div>
        </div>
      </div>

      <div class="sheet-layer"></div>
    </div>
    <p class="caption">Board. Click a lane to select it. Add <span class="mono">?scenario=bad</span> for the day this product exists for.</p>
  </body>
</html>
