name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="${RUNNER_TEMP}/private_keys"
          mkdir -p "$KEY_DIR"
          # notarytool expects a path to the .p8, not the PEM contents.
          KEY_PATH="${KEY_DIR}/AuthKey_${APPLE_API_KEY_ID}.p8"
          # Secret holds the .p8 PEM; notarytool needs a filesystem path.
          printenv APPLE_API_KEY > "$KEY_PATH"
          echo "APPLE_API_KEY=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: Build Mac DMG + updater zip (signed + notarized)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Emits dmg/zip/blockmap + latest-mac.yml (generic feed → https://plenum.sh/updates/).
        # APPLE_API_KEY is the file path from the previous step (GITHUB_ENV).
        run: npm run build && npx electron-builder --mac --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Stage public update feed
        run: |
          set -euo pipefail
          mkdir -p release-ftp
          cp release/latest-mac.yml release-ftp/
          cp release/*.zip release-ftp/
          cp release/*.blockmap release-ftp/ 2>/dev/null || true
          # Stable first-install name for the landing “Download” link.
          dmg=$(ls release/*.dmg | head -1)
          cp "$dmg" release-ftp/Plenum.dmg
          cp "$dmg" "release-ftp/$(basename "$dmg")"
          ls -la release-ftp

      - name: FTP upload to plenum.sh/updates
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./release-ftp/
          # e.g. public_html/updates/ — must be the dir served at https://plenum.sh/updates/
          server-dir: ${{ secrets.FTP_UPDATES_DIR }}
          dangerous-clean-slate: false
